# ============================================================
# 第二期：合成氨反应（哈伯法）—— 加压为什么提高产率
# 与第一期同构：气体分子数减少的反应，加压平衡正向移动
# 换一期：只改这个文件，不动任何 Python 代码
# ============================================================
meta:
  series: "你没见过的化学"
  episode_no: "02"
  title: "合成氨平衡"
  hook: "工业上几百个大气压，到底在压什么"
  watermark: false          # 全局水印开关：false = 任何画面都不加水印

style:
  # 原版深色配色（沉稳专业），字号与第一期一致
  bg: "#0A1526"
  panel: "#132238"
  panel_line: "#2E4A6B"
  text: "#EAF2FF"
  text_dim: "#8FA8C8"
  accent: "#FFC857"
  no2: "#C1440E"            # 本期不用，保留兼容
  n2o4: "#9FB2C9"           # 本期不用，保留兼容
  ox: "#E8552F"
  nitro: "#3E6FB0"          # N2 氮气（蓝）
  nh3: "#FFC857"            # NH3 氨（强调黄）
  font_cn: "Noto Sans CJK SC"

  font_small: 18
  font_body: 24
  font_caption: 24
  font_accent: 28
  font_heading: 34
  font_formula: 30
  font_formula_long: 22

  # ---- 富文字特效（可选，默认关闭）----
  # 暖色深浅版（参考启源化学）：正文白字，关键词染饱和金黄，靠"白→金"同色系深浅区分；
  # 大标题用金字配深棕描边做立体。不引入冷色，保持沉稳。
  # 想回到纯清爽风格就把 rich_text 改回 false。
  rich_text: true
  highlight_words:            # 出现即染色的关键词（染成 highlight_color 金黄）
    - "200 个大气压"
    - "反应就停止"
    - "产率"
    - "减弱"
    - "抵消"
    - "气体少"
  highlight_color: "#FFC857" # 高亮词=饱和金黄（与正文白字拉开深浅层次）
  gold_outline: "#6B4410"    # 金字标题的深棕描边（立体感，不抢眼）
  outline_width: 1.5         # 描边粗细（克制）
  heading_boost: 1.12        # 大标题放大系数（温和字号层次）

  # ---- 入场动态（可选，默认关闭）----
  # 打开后：画面元素逐层浮现 + 字幕逐字出现（打字机感），更有节奏。
  # 关掉则回到整体淡入。想静帧观感就设 false。
  motion: true

segments:
  - kind: hook
    dur: 5
    eyebrow: "平衡 · 02"
    line1: "把氮气和氢气"
    line2: "压到 200 个大气压？"
    gas_color: "nitro"      # 注射器里气体改蓝色（代表 N2/H2 混合气）

  - kind: particle
    dur: 12
    formula: "N₂ + 3 H₂  ⇌  2 NH₃"
    sub: "01  压缩那一瞬间"
    caption: "氢氮分子变少，氨分子变多"
    particles:
      a:                    # 反应物（N2 + H2），压缩后减少
        color: "nitro"
        radius: 0.055
        opacity: 0.9
        normal: 20
        compressed: 9
      b:                    # 生成物（NH3），压缩后增多
        color: "nh3"
        radius: 0.045
        opacity: 0.9
        normal: 8
        compressed: 21

  - kind: equilibrium
    dur: 12
    # 动态 v-t 曲线：曲线随时间从左侧"长"出来，末端光点 + v正/v逆 文字跟随，
    # 阶段文字随进度切换（参考启源化学）。设 false 则回到静态整图。
    curve_anim: true
    curve_grow: 5.0            # 曲线生长动画时长（秒）
    curve_stages:              # 随进度切换的跟随标注（at 为 0~1 的生长进度）
      - {at: 0.0,  text: "反应刚开始 · v正 最大，v逆 ≈ 0"}
      - {at: 0.42, text: "趋向平衡 · v正 下降，v逆 上升"}
      - {at: 0.85, text: "达到平衡 · v正 = v逆 ≠ 0"}
    question: "平衡了，反应就停止了吗？"
    formula: "v 正 = v 逆 ≠ 0"
    caption: "分子仍在反应，只是正逆速率相等"

  - kind: bars
    dur: 14
    bar_anim: true             # 三阶段依次长出柱子+数值紧跟；false 回到静态整图
    bar_grow: 0.9              # 每阶段柱子生长时长（秒）
    moment: "刚刚加压的一瞬间"
    formula: "c(NH₃) ↑  →  产率 ↑"
    caption: "加压使平衡向气体少的方向移动"
    # 三阶段：[标签, 反应物柱高, 生成物柱高, 反应物数值(可选), 生成物数值(可选)]
    bar_stages:
      - ["加压前", 1.6, 0.5]
      - ["刚加压", 2.1, 0.65]
      - ["新平衡", 0.7, 1.8]
    bar_swatches: ["ox", "nh3", "nitro"]   # 三阶段顶部色块
    bar_color_a: "nitro"    # 反应物柱（蓝）
    bar_color_b: "nh3"      # 生成物柱（黄）

  - kind: lechatelier
    dur: 9
    # 圆环过场：一闪而过的章节页（外圈金环 + 黄蓝光点绕圈 + 大页码/标题/英文）
    transition:
      number: "04"
      title: "减弱，不是抵消"
      en: "WEAKEN, NOT CANCEL"
      dur: 2.6               # 过场停留时长（秒），之后淡出进入正文
    label: "勒夏特列原理"
    line1: "减弱，不是抵消"
    line2: "加压 → 往气体少的方向移动"
    formula: "K = c²(NH₃) / [c(N₂) · c³(H₂)]"

  - kind: outro
    dur: 6
    question: "加压，氨产率怎么变？"
    opt_a: "A  提高"
    opt_b: "B  降低"
    cta: "评论区告诉我"

audio:
  # 默认无背景音乐：成片为纯画面，节奏/音乐自行后期合成。
  # 需要自动配音时改为 true（bgm 文件需存在）。
  enabled: false
  bgm: "assets/bgm.mp3"
  volume: 0.18
