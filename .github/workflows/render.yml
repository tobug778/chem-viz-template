name: 渲染化学可视化视频

# 触发方式：
# 1) 自动：推代码到 main（改 config/ACTIVE 指向本期，push 后自动渲染该期）
# 2) 手动：Actions 页 -> Run workflow -> 填要渲染的配置名（留空则用 ACTIVE）
on:
  workflow_dispatch:
    inputs:
      episode:
        description: '要渲染的配置名（config/ 下，不含 .yaml；留空用 ACTIVE）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scenes/**'
      - 'src/**'
      - 'config/**'
      - 'manim.cfg'

# 发布到 Releases 需要写权限（固定下载入口）
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装系统依赖（cairo/pango/ffmpeg/中文字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev ffmpeg fonts-noto-cjk fonts-dejavu-core

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 确定本期配置
        run: |
          INPUT="${{ github.event.inputs.episode }}"
          if [ -n "$INPUT" ]; then
            EP="$INPUT"
          elif [ -f config/ACTIVE ]; then
            EP="$(tr -d '[:space:]' < config/ACTIVE)"
          else
            EP="no2_equilibrium"
          fi
          echo "EPISODE=$EP" >> "$GITHUB_ENV"
          echo "本期配置：$EP"

      - name: 渲染竖屏视频（720x1280）
        run: |
          if [ ! -f "config/${EPISODE}.yaml" ]; then
            echo "配置文件不存在：config/${EPISODE}.yaml"; exit 1
          fi
          # 统一用通用场景 episode.py；配置名经环境变量 EPISODE 传入。
          # -r 指定竖屏分辨率 + --fps 30；不要加 -q（会覆盖成 16:9 横屏）。
          EPISODE="$EPISODE" manim -r 720,1280 --fps 30 scenes/episode.py Episode

      - name: 给成片起可读文件名
        run: |
          SRC=$(find media/videos -name '*.mp4' -type f | head -1)
          if [ -z "$SRC" ]; then echo "找不到渲染出的 mp4"; exit 1; fi
          # 从本期配置读期号与标题（用 python + pyyaml，requirements 已含）
          EPISODE_NO=$(python3 -c "import yaml;print(yaml.safe_load(open('config/${EPISODE}.yaml',encoding='utf-8'))['meta'].get('episode_no',''))")
          TITLE=$(python3 -c "import yaml;print(yaml.safe_load(open('config/${EPISODE}.yaml',encoding='utf-8'))['meta'].get('title',''))")
          # 文件名格式：<期号>_<主题>.mp4，例：04_盐的水解.mp4
          NAME="${EPISODE_NO}_${TITLE}.mp4"
          [ -z "$EPISODE_NO" ] && NAME="${TITLE}.mp4"
          mkdir -p release
          cp "$SRC" "release/${NAME}"
          # 固定名副本：让直链长期不变（网页上仍能按可读名下载）
          cp "$SRC" "release/latest.mp4"
          echo "成片文件名：$NAME"
          echo "VIDEO_NAME=$NAME" >> "$GITHUB_ENV"
          echo "EPISODE_NO=$EPISODE_NO" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"

      # 固定下载入口：每次渲染都更新同一个 release（tag=latest）。
      # 用户在浏览器收藏这一个网址即可，永远是最新成片，不用翻 run 列表。
      - name: 清理固定入口里的旧成片（只留最新一期）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" \
            > /tmp/latest_release.json || true
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("GH_TOKEN", "")
          try:
              d = json.load(open("/tmp/latest_release.json"))
              assets = d.get("assets", [])
          except Exception:
              assets = []
          for a in assets:
              req = urllib.request.Request(a["url"], method="DELETE")
              req.add_header("Authorization", "Bearer " + token)
              req.add_header("Accept", "application/vnd.github+json")
              try:
                  urllib.request.urlopen(req)
                  print("已删除旧文件:", a.get("name"))
              except Exception as e:
                  print("跳过:", a.get("name"), e)
          PY

      - name: 发布到固定下载入口（Releases/latest）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新成片 · ${{ env.EPISODE_NO }} ${{ env.TITLE }}
          body: |
            ## 固定下载入口（收藏本页即可，每次渲染后自动更新）

            当前最新成片：**${{ env.VIDEO_NAME }}**

            - 网页下载：打开本页，点下方 `Assets` 里的 mp4 即可下载
            - 直链（可当书签）：`https://github.com/${{ github.repository }}/releases/latest/download/${{ env.VIDEO_NAME }}`
            - 备用固定直链（文件名恒定）：`https://github.com/${{ github.repository }}/releases/latest/download/latest.mp4`

            每期文件名按期号+主题命名（如 `04_盐的水解.mp4`）；`latest.mp4` 是同一个文件的固定名副本，方便脚本/书签长期引用。
          files: |
            release/${{ env.VIDEO_NAME }}
            release/latest.mp4
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传成片（Artifact 备用）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EPISODE }}-mp4
          path: release/*.mp4
          if-no-files-found: error
